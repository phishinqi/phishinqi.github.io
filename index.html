<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="鱼七 & astraRuri — Tracing light, a home for two." />
    <title>鱼七 & astraRuri</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%23FF8899'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%2377BBDD' fill-opacity='.85'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Outfit：英文几何无衬线；Noto Sans SC 按 unicode-range 自动切片，只下载用到的汉字分片 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    />
    <script>
      // 在首帧前应用主题，避免闪烁
      (function () {
        var o = localStorage.getItem('theme-override');
        var d = o ? o === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <!-- 加载页 -->
    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader-count"><span id="loader-num">000</span></div>
      <div class="loader-label" data-i18n="loader.label"></div>
      <div class="loader-bar"><span id="loader-bar"></span></div>
    </div>

    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <!-- 导航 -->
    <header class="nav">
      <a class="nav-logo" href="#home" data-scroll>
        <span class="dot dot-a"></span><span class="dot dot-b"></span>
        <span class="nav-logo-text" id="nav-logo"></span>
      </a>
      <nav class="nav-links glass" aria-label="Primary">
        <a href="#home" data-scroll><span class="roll"><span data-i18n="nav.home"></span><span data-i18n="nav.home"></span></span></a>
        <a href="#us" data-scroll><span class="roll"><span data-i18n="nav.us"></span><span data-i18n="nav.us"></span></span></a>
        <a href="#work" data-scroll><span class="roll"><span data-i18n="nav.work"></span><span data-i18n="nav.work"></span></span></a>
        <a href="#contact" data-scroll><span class="roll"><span data-i18n="nav.contact"></span><span data-i18n="nav.contact"></span></span></a>
      </nav>
      <div class="nav-tools glass">
        <button class="tool" id="lang-toggle" data-i18n-aria="ui.lang">
          <span class="lang-opt" data-lang="zh">中</span><span class="lang-sep">/</span><span class="lang-opt" data-lang="en">EN</span>
        </button>
        <button class="tool" id="theme-toggle" data-i18n-aria="ui.theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><g stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" /></g></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" /></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- 1. 首屏：2D 光线追踪 -->
      <section class="hero" id="home">
        <h1 class="sr-only" id="hero-title"></h1>
        <div class="hero-ui">
          <p class="hero-kicker" data-i18n="hero.kicker"></p>
          <p class="hero-hint"><span class="pulse"></span><span id="hero-hint"></span></p>
          <div class="hero-coords" aria-hidden="true">
            <span>A <b id="coord-a">0.000 · 0.000</b></span>
            <span>B <b id="coord-b">0.000 · 0.000</b></span>
          </div>
          <a class="hero-scroll" href="#scene" data-scroll>
            <span data-i18n="hero.scroll"></span>
            <span class="hero-scroll-line"></span>
          </a>
        </div>
      </section>

      <!-- 2. 3D 体积光场景 -->
      <section class="scene" id="scene">
        <div class="scene-sticky">
          <p class="kicker" data-i18n="scene.kicker"></p>
          <h2 class="display scene-tagline" id="tagline"></h2>
        </div>
      </section>

      <!-- 3. 双人名牌 -->
      <section class="us" id="us">
        <div class="container">
          <p class="kicker"><span class="kicker-index">01</span><span data-i18n="us.kicker"></span></p>
          <div class="plates" id="plates"></div>
        </div>
      </section>

      <!-- 4. 项目牌 -->
      <section class="work" id="work">
        <div class="work-sticky">
          <div class="container work-head">
            <p class="kicker"><span class="kicker-index">02</span><span data-i18n="work.kicker"></span></p>
            <h2 class="display work-title" data-i18n="work.title"></h2>
            <p class="work-hint"></p>
          </div>
          <div class="deck" id="deck"></div>
        </div>
      </section>

      <!-- 5. 联系 / 页脚 -->
      <footer class="contact" id="contact">
        <div class="container">
          <p class="kicker"><span class="kicker-index">03</span><span data-i18n="contact.kicker"></span></p>
          <h2 class="display contact-title">
            <span data-i18n="contact.title1"></span><br /><em data-i18n="contact.title2"></em>
          </h2>
          <div class="contact-grid">
            <div class="contact-col" id="contact-email-col">
              <p class="contact-label" data-i18n="contact.email"></p>
              <a class="contact-mail" id="contact-email"></a>
            </div>
            <div class="contact-col" id="contact-links-col">
              <p class="contact-label" data-i18n="contact.elsewhere"></p>
              <ul class="link-list" id="contact-links"></ul>
            </div>
          </div>
          <div class="footer-bar">
            <span id="footer-copy"></span>
            <span data-i18n="footer.built"></span>
            <a href="#home" data-scroll class="footer-top"><span data-i18n="footer.top"></span> ↑</a>
          </div>
        </div>
      </footer>
    </main>

    <p class="fallback-note" data-i18n="fallback.webgl"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
